name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -q

  postgres-integration:
    name: PostgreSQL migrations and API integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: triageai_test
          POSTGRES_USER: triageai
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triageai -d triageai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRIAGEAI_TEST_DATABASE_URL: postgresql+psycopg://triageai:ci-only-password@localhost:5432/triageai_test
      MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://triageai:ci-only-password@localhost:5432/triageai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-backend.txt pytest httpx2 pypdf
      - name: Verify versioned upgrades and legacy row preservation
        run: python -m pytest tests/integration -q
      - name: Run API contracts and real-session isolation on PostgreSQL
        run: python -m pytest tests/backend -q

  frontend-ci:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: app/frontend/react_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - backend-tests
      - frontend-ci
      - postgres-integration

    steps:
      - name: Confirm required checks passed
        run: echo "Backend tests, frontend tests, and frontend build passed."
